<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mailchimp</title>
    <link rel="stylesheet" href="style.css" type="text/css">
</head>
<body>
    <header class="cabecalho">
        <nav>
            <a href="#">Produto</a>
            <a href="#">Recursos</a>
            <a href="#">Inspiração</a>
            <a href="#">Preços</a>
        </nav>
        <img src="./images/figura1.png" alt="Logo mailchimp">
        <div class="direita_header">
            <img src="./images/figura4.png" alt="Ícones busca e Carrinho">
            <a href="#" class="botao_transparente">Conectar</a>
            <a href="#" class="botao_verde">Cadastre-se gratuitamente</a>
        </div>
    </header>
    <section class="container">        
        <section class="esquerda">
            <h1>As lojas do Mailchimp já estão disponíveis</h1>
            <p>Impulsione as vendas, envolva os clientes e anuncie seu negócio em um só lugar. Crie sua loja virtual gratuitamente.</p>
            <a href="#" class="saiba_mais">Saiba mais</a>
        </section>
        <section class="direita">
            <div class="card_1">
                <div class="header_card_1">
                    <img src="./images/tres_pontinhos.png" alt="Três pontinhos">
                    <img src="./images/carrinho.png" alt="Carrinho" class="carrinho">
                </div>
                <h4>Big Mood Spa</h4>
                <img src="./images/figura2.png" alt="Pote" class="pote">
            </div>
            <div class="card_2">
                <div class="header_card_2">
                    <h3>Shopping Cart</h3>
                </div>
                <img src="./images/figua3.png" alt="2 itens no carrinho">
                <a href="#">Continue To Checkout</a>
            </div>
        </section>
    </section>
</body>
</html>
